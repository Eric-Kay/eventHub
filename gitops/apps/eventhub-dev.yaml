apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eventhub-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/eventhub-gitops.git
    targetRevision: main
    path: gitops/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: eventhub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
