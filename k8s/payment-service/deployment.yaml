apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: eventhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: your-ecr/payment-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: POSTGRES_DB
          value: eventhub
        - name: POSTGRES_USER
          value: eventhub
        - name: POSTGRES_PASSWORD
          value: eventhub123
        - name: POSTGRES_HOST
          value: postgres
        - name: REDIS_HOST
          value: redis
        - name: RABBITMQ_HOST
          value: rabbitmq

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: eventhub
spec:
  selector:
    app: payment-service
  ports:
  - port: 8000
    targetPort: 8000
