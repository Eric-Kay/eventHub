version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Use the configured POSTGRES_USER so the check doesn't try to connect as the container's OS user (root)
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -h localhost -p 5432 -q"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"

  auth-service:
    build: ./apps/auth-service
    env_file: .env
    ports: ["8001:8000"]
    depends_on: [postgres]

  event-service:
    build: ./apps/event-service
    env_file: .env
    ports: ["8002:8000"]
    depends_on: [postgres]

  booking-service:
    build: ./apps/booking-service
    env_file: .env
    ports: ["8003:8000"]
    depends_on: [postgres, redis, rabbitmq]

  payment-service:
    build: ./apps/payment-service
    env_file: .env
    ports: ["8004:8000"]
    depends_on: [postgres, rabbitmq]

  ticket-service:
    build: ./apps/ticket-service
    env_file: .env
    ports: ["8005:8000"]
    depends_on: [postgres, rabbitmq]

  notification-service:
    build: ./apps/notification-service
    env_file: .env
    ports: ["8006:8000"]
    depends_on: [rabbitmq]

  analytics-service:
    build: ./apps/analytics-service
    env_file: .env
    ports: ["8007:8000"]
    depends_on: [postgres]

  frontend:
    build: ./apps/frontend
    environment:
      VITE_AUTH_URL: http://localhost:8001
      VITE_EVENT_URL: http://localhost:8002
      VITE_BOOKING_URL: http://localhost:8003
      VITE_PAYMENT_URL: http://localhost:8004
      VITE_TICKET_URL: http://localhost:8005
      VITE_ANALYTICS_URL: http://localhost:8007
    ports: ["3000:3000"]
    depends_on:
      - auth-service
      - event-service

volumes:
  postgres_data:
