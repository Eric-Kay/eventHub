apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: eventhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
      - name: event-service
        image: 603108265570.dkr.ecr.us-east-1.amazonaws.com/dev/event-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: POSTGRES_DB
          value: "eventhub"
        - name: POSTGRES_USER
          value: "eventhub"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eventhub-app-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: RABBITMQ_PORT
          value: "5672"
---
apiVersion: v1
kind: Service
metadata:
  name: event-service
  namespace: eventhub
spec:
  selector:
    app: event-service
  ports:
  - port: 8000
    targetPort: 8000