apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: eventhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      containers:
      - name: ticket-service
        image: 603108265570.dkr.ecr.us-east-1.amazonaws.com/dev/ticket-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: POSTGRES_DB
          value: eventhub
        - name: POSTGRES_USER
          value: eventhub
        - name: POSTGRES_PASSWORD
          value: eventhub123
        - name: POSTGRES_HOST
          value: postgres
        - name: REDIS_HOST
          value: redis
        - name: RABBITMQ_HOST
          value: rabbitmq

---
apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  namespace: eventhub
spec:
  selector:
    app: ticket-service
  ports:
  - port: 8000
    targetPort: 8000
