namespace: eventhub

imageRegistry: 603108265570.dkr.ecr.us-east-1.amazonaws.com/dev

global:
  env:
    POSTGRES_DB: eventhub
    POSTGRES_USER: eventhub
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"

    REDIS_HOST: redis
    REDIS_PORT: "6379"

    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: "5672"

frontend:
  image: frontend
  tag: latest

authService:
  image: auth-service
  tag: latest

eventService:
  image: event-service
  tag: latest

bookingService:
  image: booking-service
  tag: latest

paymentService:
  image: payment-service
  tag: latest

notificationService:
  image: notification-service
  tag: latest

analyticsService:
  image: analytics-service
  tag: latest