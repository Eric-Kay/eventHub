namespace: eventhub

imageRegistry: 603108265570.dkr.ecr.us-east-1.amazonaws.com/dev

global:
  env:
    POSTGRES_DB: eventhub
    POSTGRES_USER: eventhub
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: "5672"

ingress-nginx:
  controller:
    service:
      type: LoadBalancer
    ingressClassResource:
      name: nginx
      enabled: true
      default: true
    ingressClass: nginx
    admissionWebhooks:
      enabled: false

kube-prometheus-stack:
  grafana:
    enabled: true
    adminUser: admin
    adminPassword: admin123
    service:
      type: ClusterIP

  prometheus:
    enabled: true
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false

  alertmanager:
    enabled: true
kube-prometheus-stack:
  prometheusOperator:
    admissionWebhooks:
      enabled: false
      patch:kube-prometheus-stack:
  prometheusOperator:
    admissionWebhooks:
      enabled: false
      patch:
        enabled: false

  grafana:
    enabled: true
    adminUser: admin
    adminPassword: admin123

  prometheus:
    enabled: true
        enabled: false

  grafana:
    enabled: true
    adminUser: admin
    adminPassword: admin123

  prometheus:
    enabled: true
